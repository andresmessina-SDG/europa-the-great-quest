:root{
 --night:#10252b;--navy:#173a3f;--blue:#244e51;--line:#ad8c5a;--line-soft:rgba(139,101,52,.23);

}

.icon-button,.outline-button{border:1px solid rgba(223,186,120,.48);color:#f1deb9;background:#213c3d;border-radius:3px;text-transform:uppercase;letter-spacing:.105em;font-size:10px;padding:12px 15px;transition:transform .2s,background .2s,border-color .2s}
.icon-button:hover,.outline-button:hover{background:#365653;border-color:#efca89;transform:translateY(-2px)}

.footer{border-top:1px solid rgba(238,203,141,.29);min-height:71px;color:#c0c6ac;font-size:10px;letter-spacing:.15em}.footer-sep{color:#e5bc73}
/* Intro = a luminous atlas leaf in a dark ocean */
.home{padding-top:clamp(27px,3.6vh,50px);padding-bottom:32px;position:relative}
.home-grid{grid-template-columns:minmax(385px,.9fr) minmax(520px,1.1fr);gap:clamp(24px,2.8vw,44px);align-items:stretch}
.hero{position:relative;background:
 radial-gradient(ellipse at 92% 1%,rgba(255,255,255,.35),transparent 42%),
 repeating-linear-gradient(25deg,transparent 0 40px,#855e2910 40.6px,transparent 41px),
 linear-gradient(134deg,#f9eccd 0%,#f1dfb9 58%,#e9d4a8 100%);
 border:1px solid #d5b778;border-radius:3px;padding:clamp(28px,3.2vw,48px);box-shadow:0 26px 65px #0005,inset 0 0 0 5px #f6e8c8,inset 0 0 0 6px #b59661;isolation:isolate;overflow:hidden;color:var(--ink);min-height:640px;
 animation:pageRise .8s both;
}
.hero:before,.hero:after{content:"✥";position:absolute;font:34px var(--serif);color:#ba9260;z-index:-1;opacity:.6}

.hero-inner{position:relative;z-index:1}
.hero-sup{display:flex;gap:10px;align-items:center;justify-content:space-between;border-bottom:1px solid #bf9f65;padding-bottom:14px;color:#73603d;font-weight:800;font-size:9px;letter-spacing:.18em}
.hero-sup span:last-child{font:italic 13px var(--serif);text-transform:none;letter-spacing:0;color:#906e47}
.eyebrow{color:#955134;font-size:11px;letter-spacing:.22em}.eyebrow:before{background:#a35c34;width:30px}
.hero .eyebrow{margin-top:23px}
.hero-title{font:600 clamp(62px,6.4vw,112px)/.94 var(--serif);letter-spacing:-.065em;margin:14px 0 5px;color:#203b35;text-shadow:1px 1px 0 #fff5d7;text-wrap:balance}
.hero-title span{color:#a3422d;font-size:.53em;letter-spacing:-.07em;line-height:1.2;margin:11px 0 0;font-style:italic;font-weight:400;text-shadow:none}
.hero-desc{color:#455a4e;font-size:14px;line-height:1.79;max-width:480px;margin:22px 0 24px}
.hero-desc strong{color:#98442f}
.expedition-mark{position:absolute;z-index:0;right:-17px;top:138px;width:165px;height:165px;opacity:.055;transform:rotate(-19deg);pointer-events:none}
.mode-switch{gap:10px;margin-bottom:12px}
.mode{flex:1 1 140px;min-width:0;background:#fff4d9;border:1px solid #b9a079;border-radius:3px;color:#243d34;padding:11px 12px;box-shadow:0 2px 0 rgba(84,61,36,.12);transition:transform .2s,box-shadow .2s,border-color .2s,background .2s}
.mode:hover{border-color:#a1422e;transform:translateY(-2px)}
.mode.selected{background:#24443f;color:#fff0cf;border:1px solid #25483f;box-shadow:inset 0 0 0 1px #d6b277,0 4px 0 #142f2b}
.mode-ico{width:35px;height:35px;min-width:35px;border:1px solid #b39c76;color:#a65a35;border-radius:50%;font-size:21px}
.mode.selected .mode-ico{color:#f6cd85;border-color:#ab905e}
.mode strong{font-size:12px;letter-spacing:.03em}.mode small{font-size:10px;color:#737866}
.mode.selected small{color:#c1d1bf}
.login-row{margin:21px 0 16px}.name-label{color:#685940;font-size:10px;letter-spacing:.11em;font-weight:850}
.name-input{color:#253b35;background:#fff6e2;border:1px solid #b69b70;border-radius:3px;min-height:43px;box-shadow:inset 0 1px 3px #0001}
.name-input::placeholder{color:#8e927e}.name-input:focus{border-color:#a3452c}
.big-button,.next-button{background:linear-gradient(115deg,#b94c32,#9f3826);border:1px solid #7f3023;color:#fff6e2;border-radius:3px;box-shadow:0 4px 0 #702e23,0 12px 19px #54341f35;padding:16px 27px;font-size:12px;letter-spacing:.14em;transition:transform .18s,box-shadow .18s,filter .18s}
.big-button:hover,.next-button:hover{filter:brightness(1.12);transform:translateY(-3px);box-shadow:0 7px 0 #702e23,0 17px 26px #54341f40}
.big-button:active,.next-button:active{transform:translateY(3px);box-shadow:0 1px 0 #702e23}
.button-arrow{font-size:19px;vertical-align:-1px;margin-left:16px}
.fine-print{color:#716d59;font-size:10.5px;line-height:1.55;max-width:430px;margin-top:17px}
.hero-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 0;color:#6c725e;font:italic 13px var(--serif)}
.hero-meta i{width:22px;height:1px;background:#b48d57;display:block}
/* The hand-drawn luminous chart */
.map-framed{padding:10px;background:#173b3b;border:1px solid #b9955e;border-radius:4px;box-shadow:0 30px 80px #0005,inset 0 0 0 2px #132e32;animation:pageRise .9s .1s both}
.map-framed:before{inset:5px;border:1px solid rgba(236,193,107,.7);border-radius:0;z-index:5}
.home-grid>.map-framed{align-self:stretch;min-height:660px;display:flex;flex-direction:column;justify-content:center;position:relative}
.map-surface{border-radius:1px;background:#b9d2bb;line-height:0;box-shadow:inset 0 0 0 1px #b18e5b}
.home-grid>.map-framed .map-surface{width:100%}
.map-surface svg{aspect-ratio:1100/650}
.map-framed .map-header{position:absolute;top:25px;left:25px;background:rgba(247,229,191,.97);backdrop-filter:none;max-width:270px;color:#243c35;padding:13px 15px 14px;border:1px solid #ab8656;border-radius:2px;box-shadow:3px 3px 0 #24443a3b}
.map-header-kicker{font-size:9px;color:#9b4832;font-weight:850;letter-spacing:.19em}
.map-header-title{font:25px/1.3 var(--serif);color:#243b32}
.map-header-sub{color:#6d745a;font-size:9px;letter-spacing:.06em;font-weight:750;text-transform:uppercase}
.map-caption{background:#f8eaccf0;color:#65513b;border:1px solid #b99866;border-radius:2px;font-size:9px;letter-spacing:.09em;padding:9px 12px;right:25px;bottom:24px;z-index:4}
.map-flyer{color:#506c58;font:italic 13px var(--serif);left:23px;bottom:23px}
.country{fill:#b2be8a;stroke:#496d61;stroke-width:1.15px;transition:fill .15s,stroke .15s,filter .15s;filter:drop-shadow(0 1px 0 rgba(255,249,218,.18))}
.country:nth-child(4n){fill:#b8bd8a}.country:nth-child(4n + 1){fill:#a9bc89}.country:nth-child(5n){fill:#a8b993}
.country:hover{fill:#f3da8f;stroke:#694f31;stroke-width:2.1px;filter:drop-shadow(0 0 4px rgba(251,225,140,.7))}
.country.map-selected{fill:#e5b44c!important;stroke:#8e512a;stroke-width:3px;filter:drop-shadow(0 0 6px #ffefa7)}
.country.map-error{fill:#be5d48!important;stroke:#f9e3af;stroke-width:2.7px}
.country.map-hint{fill:#eac16c!important;stroke:#9b3b30;stroke-width:3px;stroke-dasharray:5 2}
.map-surface.zoomed{scrollbar-color:#b99458 #ede1ba}
.map-tooltip{border:1px solid #b28b57;border-radius:2px;background:#fff3d5;color:#263d33;box-shadow:3px 4px 0 #133a3660;font-family:var(--serif);font-size:14px}
.map-ribbon{position:absolute;top:15px;right:20px;z-index:5;background:#ab4834;color:#fff1d5;font:800 9px var(--body);letter-spacing:.19em;text-transform:uppercase;padding:9px 13px;border:1px solid #e1c392;box-shadow:3px 4px 0 rgba(36,35,28,.29);pointer-events:none}
.map-border-ornament{position:absolute;z-index:3;right:30px;top:100px;width:52px;height:52px;opacity:.5;pointer-events:none}
.map-zoom{background:#f5e7c3;color:#3d493a;border:1px solid #967a51;border-radius:2px;left:25px;bottom:25px;box-shadow:2px 3px 0 #163c3e66;letter-spacing:.08em}
.map-zoom:hover{background:#fff6da;color:#863e2f}

.chapter-cell{border:1px solid rgba(223,187,116,.42);border-top:3px solid #d4a764;padding:18px 15px 17px;gap:13px;background:linear-gradient(140deg,#19363a,#1b3336);min-height:92px;transition:background .2s,transform .2s;position:relative}
.chapter-cell:after{content:"◆";position:absolute;right:9px;top:8px;color:#a88a53;font-size:7px;opacity:.8}
.chapter-cell:hover{transform:translateY(-3px);background:#244947}
.chapter-num{font:italic 30px/1 var(--serif);color:#e1b76c}
.chapter-cell strong{color:#f1e1c2;letter-spacing:.11em;font-size:10px;margin-top:2px}
.chapter-cell small{color:#b4b9a5;font-size:10px;line-height:1.45;margin-top:7px}
/* Play interface: inked parchment, brass chapter HUD */
.game{padding:28px 0 45px}
.hud{background:linear-gradient(120deg,#244340,#152c31);border:1px solid #9f8657;border-radius:3px;padding:14px 20px;margin-bottom:19px;box-shadow:inset 0 0 0 3px #1b3536,inset 0 0 0 4px #7c714f45,0 10px 28px #0003;gap:clamp(12px,3vw,52px)}
.hud-label{color:#c6b88f;font-size:9px;letter-spacing:.17em}.hud-name{color:#e8bb78}.hud-value{font:600 29px/1.25 var(--serif);color:#fff0cf}.hud-value.streak-value{color:#efc474}
.hud-chapter{color:#f5e9cc;font-family:var(--serif);font-size:17px;font-weight:500}
.chap-progress{background:#0e2225;height:5px;border:1px solid #45605c;max-width:230px;margin-top:10px}
.chap-fill{background:linear-gradient(90deg,#b15538,#efd28a)}
.game-layout{grid-template-columns:minmax(340px,.85fr) minmax(490px,1.15fr);gap:21px}
.question-panel{background:
 radial-gradient(ellipse at 96% 0,#fff8e95d,transparent 45%),
 repeating-linear-gradient(0deg,transparent 0 44px,#b3996e10 45px,transparent 46px),
 linear-gradient(145deg,#f8ebcc,#eeddb9);
 border:1px solid #d0ad71;border-radius:3px;min-height:550px;padding:clamp(24px,3vw,42px);color:#293d34;box-shadow:inset 0 0 0 5px #f6e8c7,inset 0 0 0 6px #af9061,0 18px 38px #0003;}
.question-panel:before{content:"❧";top:-70px;right:6px;font-size:225px;color:#a68b5923;transform:rotate(-14deg)}
.question-number{font-size:10px;color:#74644b;font-weight:850;border-bottom:1px solid #c3a67b;padding-bottom:13px;max-width:92%;letter-spacing:.12em}
.question-type{color:#a54532;background:#a84d3113;border:1px solid #a54c3150;border-radius:2px;display:inline-block;padding:6px 9px;letter-spacing:.13em;font-size:9px;margin-top:23px}
.question-title{font:600 clamp(25px,2.65vw,39px)/1.21 var(--serif);letter-spacing:-.027em;color:#203d33;margin:19px 0 26px;min-height:0}
.question-help{color:#5d6a5c;font-size:13px}
.answers{gap:11px}.answer-button{background:#fff8e7;color:#263c34;border:1px solid #c8b38c;border-left:3px solid #b29b76;border-radius:3px;min-height:64px;padding:11px 14px;box-shadow:0 3px 0 #b7a18155;position:relative;overflow:hidden;transition:background .16s,border .16s,transform .16s,box-shadow .16s}
.answer-button:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(95deg,transparent 65%,#ba9f6522 100%);opacity:0;transition:opacity .2s}
.answer-button:hover:not(:disabled){background:#fff3d2;border-color:#ac6640;border-left-color:#a44b30;transform:translateX(4px);box-shadow:-3px 3px 0 #b7a18155}
.answer-button:hover:not(:disabled):before{opacity:1}
.answer-key{border:1px solid #b9a07c;border-radius:50%;width:35px;min-width:35px;height:35px;color:#995238;font:700 15px var(--serif);background:#f1e1c0}
.answer-txt{color:inherit;font-size:13px;line-height:1.5}
.answer-button.is-correct{background:#d6e9d0;color:#20513c;border-color:#639272;border-left:4px solid #356a50;opacity:1}
.answer-button.is-correct .answer-key{background:#397455;color:#fffbe8;border-color:#397455}
.answer-button.is-incorrect{background:#f4d6c7;color:#7f3429;border-color:#bf6c50;border-left:4px solid #b24632;opacity:1}
.answer-button.is-incorrect .answer-key{background:#a94332;color:#fff8e7;border-color:#a94332}
.answer-button.is-muted{opacity:.38}
.time-line{background:#dbc39c;height:7px;border:1px solid #aa8b5e}.time-fill{background:linear-gradient(90deg,#bc7149,#36765e)}.time-fill.rush{background:#b63f32}
.question-footer{margin-top:23px;gap:13px}.hint-button{color:#7f4b34;border:1px dashed #b88d59;background:#eeddb7;border-radius:2px;padding:10px 13px;font-size:10px;letter-spacing:.06em}.hint-button:hover:not(:disabled){background:#fff0cf}.hint-button:disabled{opacity:.45}
.keyboard-help{color:#837255;font-size:9px;letter-spacing:.1em;font-weight:750}
.feedback{background:#e1ecd8;border:1px solid #99af8d;border-left:5px solid #477c5b;border-radius:2px;box-shadow:0 3px 0 #b8c59e44;margin-top:23px;color:#1e4436}
.feedback.bad{background:#f4dfd0;border-color:#ce987e;border-left-color:#ad4e3a}
.feedback-title{font:600 25px var(--serif);color:#276b47}.feedback.bad .feedback-title{color:#a0412d}
.feedback-score{color:#955336}.feedback-text{color:#304d3c;font-size:13px}.feedback-quip{color:#646f5c}
.next-button{margin-top:15px}
/* Geography display: framed chart and field notes */
.game-map{position:sticky;top:15px;animation:none}
.game-map .map-header{position:relative;top:auto;left:auto;max-width:none;width:100%;margin:0 0 9px;padding:11px 14px;display:flex;align-items:center;gap:16px;border-radius:2px;background:#f3e2bc;border:1px solid #b28d57;color:#314d41;box-shadow:none}
.game-map .map-header-title{font-size:21px;color:#203e32;white-space:nowrap}
.game-map .map-header-sub{color:#775c41;font-size:9px;letter-spacing:.06em;margin-left:auto;text-align:right}

.game-map .map-ribbon{display:none}
.map-status-bar{padding:4px 7px 0;color:#d3d1b4;font-size:10px;letter-spacing:.075em}.map-status-bar strong{color:#e5b66c}
.mini-fact{background:#23433f;border:1px solid #98794c;border-left:4px solid #be9559;border-radius:2px;padding:18px 19px;box-shadow:inset 0 0 0 3px #1c3836}
.mini-fact-symbol{color:#e7bd76;font:30px/1 var(--serif)}
.mini-fact strong{color:#efcf96;font-size:10px;letter-spacing:.15em}.mini-fact p{color:#d0d8c4;font-size:12px}
.keyboard-map{border-top:1px solid #b39a73;padding-top:12px}
.keyboard-map summary{color:#7b563b!important}
.keyboard-map select{background:#fff7dd!important;color:#263c34!important;border:1px solid #ad8b5c!important}
/* Results: a guild certificate */
.results{padding:30px 0 70px;max-width:920px}
.results-head{background:
 radial-gradient(ellipse at 50% 6%,#fff7e7 0%,transparent 65%),
 linear-gradient(#f6e9c9,#e9d4aa);
 color:#203b33;border:1px solid #c09e66;padding:30px 45px 38px;box-shadow:inset 0 0 0 6px #f4e5c4,inset 0 0 0 7px #b69563,0 24px 44px #0005;position:relative}
.results-head:before,.results-head:after{content:"❦";position:absolute;top:15px;color:#a78856;font:30px var(--serif)}.results-head:before{left:22px}.results-head:after{right:22px}
.seal{background:radial-gradient(circle,#b75135,#792c27);border:2px solid #cf8e66;box-shadow:inset 0 0 0 7px #a84030,inset 0 0 0 8px #e3a77b,0 7px 12px #50341e56;color:#ffe6b7;margin-bottom:23px;animation:sealArrive .8s ease-out both}

.result-title{color:#234236;font-size:clamp(36px,5.2vw,69px)}.result-sub{color:#6b6450}.result-score{color:#aa432f;font-weight:600;margin:20px 0 9px;text-shadow:2px 2px #fef3d6}.result-label{color:#866948}
.new-best{color:#f8edce;background:#a4432e;border:1px solid #773c2c;border-radius:2px;letter-spacing:.14em}
.results-head p[style]{color:#625e51!important}
.result-stats{gap:13px;margin:20px 0}.result-stat{background:#21423d;border:1px solid #c39f66;border-radius:3px;box-shadow:inset 0 0 0 3px #1c3833;text-align:center;padding:22px 14px}

.result-actions{gap:12px}.result-actions .outline-button{padding:14px 21px}
.review{border-top:1px solid #af9d77;padding:28px 30px;margin-top:35px;background:#eee0bf;color:#2b4036;box-shadow:0 12px 28px #0004}
.review h3{font:600 29px var(--serif);color:#234136}.review-row{border-bottom:1px solid #c6b18a}.review-tag{color:#97482f}.review-main p{color:#57654d}.review-main strong{color:#253d32}
.toast{background:#f4e5c3;border:1px solid #a77d47;border-radius:3px;color:#243e32;box-shadow:3px 5px 0 #061e1d80;letter-spacing:.01em}
/* Illumination and tactile details */
@keyframes pageRise{from{opacity:0;transform:translateY(17px)}to{opacity:1;transform:translateY(0)}}
@keyframes compassFloat{50%{transform:rotate(16deg)}}
@keyframes sealArrive{from{transform:rotate(-19deg) scale(.7);opacity:0}to{transform:rotate(0) scale(1);opacity:1}}
@keyframes mapCurrent{to{transform:translateX(26px)}}
@keyframes inkBloom{from{opacity:.5;filter:saturate(.7)}to{opacity:1;filter:saturate(1)}}
.map-surface svg{animation:inkBloom 1s ease both}
.map-surface #seaGrid{opacity:.8}
.map-surface #waves{animation:mapCurrent 16s ease-in-out infinite alternate}

@media(max-width:600px){.site-shell{padding:0 12px}.topbar{height:76px}.brand-symbol{height:40px;width:40px;font-size:25px}.brand-name{font-size:19px}.brand-sub{font-size:7px}.top-actions{gap:7px}.icon-button{padding:9px 10px}.footer{font-size:8px;min-height:60px}.hero{padding:25px 21px 28px}.hero-sup{font-size:8px;letter-spacing:.12em}.hero-sup span:last-child{font-size:11px}.hero .eyebrow{font-size:9px;letter-spacing:.15em;margin-top:18px}.hero-title{font-size:clamp(55px,15.5vw,75px);margin-top:14px}.hero-title span{font-size:.55em;margin-top:7px}.hero-desc{margin:19px 0}.mode{padding:10px 9px}.mode-ico{width:30px;min-width:30px;height:30px;font-size:16px}.mode strong{font-size:11px}.mode small{font-size:9px}.login-row{margin-top:17px;gap:8px}.name-label{font-size:9px}.name-input{width:100%;max-width:260px}.fine-print{font-size:10px}.map-framed .map-header{top:18px;left:18px;padding:8px 9px}.map-header-title{font-size:17px}.map-header-kicker{font-size:7px}.map-caption{right:15px;bottom:16px;font-size:8px;padding:6px}.map-ribbon{top:11px;right:12px;font-size:7px;padding:7px}.home-grid>.map-framed .map-header-sub{display:none}.game-map .map-header{gap:8px;padding:8px 9px}.game-map .map-header-title{font-size:16px}.game-map .map-header-sub{display:none}.game-map .map-caption{bottom:17px}.hud{grid-template-columns:repeat(4,minmax(0,1fr));gap:13px 7px;padding:12px}.hud>div:first-child{grid-column:1/-1}.hud-value{font-size:22px}.hud-chapter{font-size:15px}.game-layout{gap:15px}.question-panel{padding:23px 20px}.question-title{font-size:clamp(27px,7.2vw,34px)}.question-type{margin-top:15px}.answer-button{min-height:59px;padding:10px}.answer-txt{font-size:12px}.keyboard-help{display:none}.map-status-bar{font-size:9px}.results-head{padding:30px 20px}.result-stats{gap:6px}.result-stat{padding:13px 6px}.result-stat strong{font-size:26px}.result-stat small{font-size:8px}.review{padding:20px 15px}.game-map .map-surface svg{min-height:180px}.map-zoom{bottom:17px;left:17px}}
@media(max-width:375px){.mode{flex-basis:100%}.hero-title{font-size:53px}.map-header-title{font-size:14px}.brand-name{font-size:17px}.brand{gap:9px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

:"choice","tag":"TRIVIA"},{"pool":"land","q":"The Danube River flows through how many countries?","options":["3","6","10","19"],"answer":"10","fact":"The Danube flows through ten European countries, making it a truly international river.","kind":"choice","tag":"TRIVIA"},{"pool":"land","q":"Which two countries share the Iberian Peninsula?","options":["Italy and Greece","Spain and Portugal","France and Germany","Norway and Sweden"],"answer":"Spain and Portugal","fact":"Spain and Portugal occupy most of the Iberian Peninsula.","kind":"choice","tag":"TRIVIA"},{"pool":"land","q":"Which sea separates much of southern Europe from northern Africa?","options":["The Baltic Sea","The Mediterranean Sea","The North Sea","The Black Sea"],"answer":"The Mediterranean Sea","fact":"The Mediterranean separates much of Europe from Africa.","kind":"choice","tag":"TRIVIA"},{"pool":"land","q":"Which European country is especially famous for fjords carved by glaciers?","options":["Norway","Netherlands","Portugal","Hungary"],"answer":"Norway","fact":"Glaciers carved Norway’s dramatic, steep-sided fjords.","kind":"choice","tag":"TRIVIA"},{"pool":"land","q":"Why does Iceland have many volcanoes?","options":["It sits at an active plate boundary","It is next to the Sahara","It is under a tropical rainforest","It has no rivers"],"answer":"It sits at an active plate boundary","fact":"Iceland lies along an active boundary between tectonic plates.","kind":"choice","tag":"TRIVIA"},{"pool":"land","q":"Which country has reclaimed land from the sea, with some areas below sea level?","options":["Switzerland","Netherlands","Austria","Greece"],"answer":"Netherlands","fact":"The Netherlands has created polders by draining and protecting land once covered by water.","kind":"choice","tag":"TRIVIA"},{"pool":"land","q":"Which famous mountain range crosses several European countries?","options":["The Himalayas","The Rocky Mountains","The Alps","The Atlas Mountains"],"answer":"The Alps","fact":"The Alps run across several European countries, including France, Switzerland, Italy and Austria.","kind":"choice","tag":"TRIVIA"},{"pool":"land","q":"Which mountain is the highest in the European Union, according to our facts sheet?","options":["Mont Blanc","Mount Fuji","Ben Nevis","Mount Etna"],"answer":"Mont Blanc","fact":"Mont Blanc rises to roughly 4,809 meters in the Alps. The EU is not the same as the continent.","kind":"choice","tag":"TRIVIA"},{"pool":"land","q":"Near the Arctic Circle, how long can daylight last in summer?","options":["Only 2 hours","Almost 24 hours","Exactly 12 hours every day","Only 6 hours"],"answer":"Almost 24 hours","fact":"The far north can experience nearly 24 hours of summer daylight.","kind":"choice","tag":"TRIVIA"},{"pool":"land","q":"Which country is Europe’s smallest independent country?","options":["Luxembourg","Iceland","Vatican City","Malta"],"answer":"Vatican City","fact":"Vatican City, surrounded by Rome, is the smallest independent country in the world.","kind":"choice","tag":"TRIVIA"},{"pool":"land","q":"Which is the largest country with territory in Europe?","options":["Germany","France","Spain","Russia"],"answer":"Russia","fact":"Russia extends across eastern Europe and northern Asia, making it enormous.","kind":"choice","tag":"TRIVIA"},{"pool":"land","q":"Which of these is a European island?","options":["Crete","Madagascar","Borneo","Honshu"],"answer":"Crete","fact":"Crete is a Greek island in the Mediterranean Sea.","kind":"choice","tag":"TRIVIA"},{"pool":"land","q":"Which peninsula is shaped famously like a boot?","options":["Scandinavian","Italian","Iberian","Balkan"],"answer":"Italian","fact":"The Italian Peninsula is widely described as boot-shaped.","kind":"choice","tag":"TRIVIA"},{"pool":"land","q":"Which country is mostly on the Scandinavian Peninsula?","options":["Norway","Portugal","Italy","Ireland"],"answer":"Norway","fact":"Norway and Sweden occupy most of the Scandinavian Peninsula.","kind":"choice","tag":"TRIVIA"},{"pool"       if(!loc)loc=shuffle(all.filter(q=>q.kind==='locate'))[0];
      if(loc)usedTargets.add(loc.target);
      const tf=shuffle(all.filter(q=>q.tag==='TRUE OR TROLL'))[0];
      const multi=shuffle(all.filter(q=>q.kind==='choice' && q.tag!=='TRUE OR TROLL')).slice(0,3);
      let batch=shuffle([loc,tf,...multi].filter(Boolean));
      // Keep all chapter questions together but randomize the order within each chapter.
      picked.push(...batch);
    }
    return picked.map(q=>({...q,options:q.options?shuffle(q.options):[],answer:q.answer || q.target}));
  }
  function startGame(){state.name=(document.getElementById('playerName')?.value || state.name || '').trim().slice(0,18);state.run=pickRun();state.index=0;state.score=0;state.correct=0;state.streak=0;state.bestStreak=0;state.review=[];state.hints=3;state.newBest=false;state.screen='play';state.zoomed=false;beginQuestion();window.scrollTo({top:0,behavior:'instant'});}
  function clearTimer(){if(state.timer){clearInterval(state.timer);state.timer=null;}}
  function beginQuestion(){clearTimer();state.answer=null;state.answered=false;state.hinted=false;state.disabledOptions=[];state.earned=0;state.timeLeft=state.mode==='sprint'?25:null;state.startedAt=Date.now();state.zoomed=false;state.mapScroll={left:0,top:0};renderGame();if(state.mode==='sprint'){state.timer=setInterval(()=>{if(state.answered){clearTimer();return;}const remaining=Math.max(0,25-Math.floor((Date.now()-state.startedAt)/1000));if(remaining!==state.timeLeft){state.timeLeft=remaining;updateTimerUI();}if(remaining<=0)answerQuestion(null,true);},180);}}
  function updateTimerUI(){const timer=document.getElementById('timerVal');if(timer)timer.textContent=`${state.timeLeft}s`;const bar=document.getElementById('timeFill');if(bar){bar.style.width=`${100*state.timeLeft/25}%`;bar.classList.toggle('rush',state.timeLeft<=7);}document.getElementById('timerHolder')?.classList.toggle('timer-urgent',state.timeLeft<=7);}
  function renderGame(){
    const q=state.run[state.index],stage=STAGES[Math.floor(state.index/5)];
    let progress=state.index/20*100;
    const answers=q.kind==='choice' ? `<div class="answers" role="group" aria-label="Choose an answer">${q.options.map((opt,i)=>{
      const hidden=state.disabledOptions.includes(opt),cls=state.answered?(opt===q.answer?'is-correct':opt===state.answer?'is-incorrect':'is-muted'):hidden?'is-muted':'';
      return `<button type="button" class="answer-button ${cls}" data-answer="${esc(opt)}" ${state.answered||hidden?'disabled':''}><span class="answer-key">${'ABCD'[i]}</span><span class="answer-txt">${esc(opt)}</span></button>`;
    }).join('')}</div>` : `<p class="question-help">Select the correct country directly on the map. Coastlines are more useful than guesses.</p><div style="border:1px dashed #637e7e;border-radius:7px;padding:14px 16px;font-size:12px;color:#c7d7cf">${state.answered?'The answer is highlighted on the map.': 'Click the country on the atlas to your right (or below on mobile).'}</div>${!state.answered?'<button type="button" class="outline-button" id="goToAtlas" style="margin-top:12px">Go to atlas ↓</button>':''}<details class="keyboard-map" style="margin-top:14px;font-size:12px;color:#c4d4cb"><summary style="cursor:pointer">Keyboard / accessibility option</summary><label for="countrySelect" style="display:block;margin-top:10px">Choose a country from the list:</label><select id="countrySelect" ${state.answered?'disabled':''} style="margin-top:5px;background:#132b36;color:#f6edd6;border:1px solid #6d8a87;border-radius:6px;padding:9px;max-width:100%;width:270px"><option value="">Select a country…</option>${COUNTRIES.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('')}</select><button class="outline-button" id="submitCountry" ${state.answered?'disabled':''} style="margin-left:7px">Submit</button></details>`;
    app.innerHTML=`<section class="game"><div class="hud"><div><div class="hud-label">EXPEDITION / CHAPTER ${Math.floor(state.index/5)+1} OF 4</div><div class="hud-chapter">${esc(stage.name)}</div><div class="chap-progress"><div class="chap-fill" style="width:${progress}%"></div></div></div><div><div class="hud-label">SCORE</div><div class="hud-value" id="hudScore">${state.score.toLocaleString()}</div></div><div><div class="hud-label">STREAK</div><div class="hud-value streak-value">${state.streak?`${state.streak}×`:'—'}</div></div><div><div class="hud-label">QUESTION</div><div class="hud-value">${state.index+1}<span style="font-size:13px;color:#94acae"> / 20</span></div></div><div id="timerHolder"><div class="hud-label">${state.mode==='sprint'?'CLOCK':'MODE'}</div><div class="hud-value" id="timerVal">${state.mode==='sprint'?`${state.timeLeft}s`:'∞'}</div></div></div><div class="game-layout"><div class="question-panel"><div class="question-number">${esc(stage.glyph)} &nbsp; / &nbsp; ${esc(stage.subtitle)}</div><div class="question-type">${esc(q.tag)}</div><h2 class="question-title">${esc(q.q)}</h2>${answers}${state.mode==='sprint'?`<div class="time-line" aria-label="Time remaining"><div id="timeFill" class="time-fill" style="width:${100*state.timeLeft/25}%"></div></div>`:''}<div class="question-footer"><button type="button" class="hint-button" id="hintButton" ${state.answered||state.hinted||state.hints<=0?'disabled':''}>✧ &nbsp; Signal flare (${state.hints} left)</button><span class="keyboard-help">${q.kind==='choice'?'PRESS 1–4 TO ANSWER':'SELECT ON THE MAP'}</span></div><div id="feedbackMount">${state.answered?feedbackHTML(q):''}</div></div><div>${mapHTML({game:true,locked:state.answered})}<div class="map-status-bar"><span>${q.kind==='locate'&&!state.answered?'COUNTRY LABELS HIDDEN FOR THE CHALLENGE':'HOVER COUNTRIES TO DISCOVER THEIR NAMES'}</span><strong>${state.mode==='sprint'?'TIMED VOYAGE':'TAKE YOUR TIME'}</strong></div><div class="mini-fact"><div class="mini-fact-symbol">✧</div><div><strong>FIELD JOURNAL · ${esc(stage.name)}</strong><p>${esc(stage.hint)}</p></div></div></div></div></section>`;
    app.querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',()=>answerQuestion(b.dataset.answer)));
    document.getElementById('hintButton').addEventListener('click',useHint);
    if(q.kind==='locate'){
      document.getElementById('submitCountry')?.addEventListener('click',()=>{let x=document.getElementById('countrySelect')?.value;if(x)answerQuestion(x);});document.getElementById('goToAtlas')?.addEventListener('click',()=>document.getElementById('mapSurface')?.scrollIntoView({behavior:'smooth',block:'center'}));
    }
    const next=document.getElementById('nextButton');if(next)next.addEventListener('click',nextQuestion);
    setupMap(true);
    if(q.kind==='locate' && state.answered)markMapAnswers();
  }
  function setupMap(game){
    const surface=document.getElementById('mapSurface');if(!surface)return;
    const tip=surface.querySelector('#mapTooltip');const zoom=document.getElementById('mapZoom');if(state.zoomed && game){surface.scrollLeft=state.mapScroll.left;surface.scrollTop=state.mapScroll.top;}zoom?.addEventListener('click',()=>{state.zoomed=!state.zoomed;surface.classList.toggle('zoomed',state.zoomed);zoom.textContent=state.zoomed?'− Normal view':'+ Enlarge map';zoom.setAttribute('aria-pressed',String(state.zoomed));if(state.zoomed){surface.scrollLeft=(surface.scrollWidth-surface.clientWidth)/2;surface.scrollTop=(surface.scrollHeight-surface.clientHeight)/2;}else{surface.scrollLeft=0;surface.scrollTop=0;}state.mapScroll={left:surface.scrollLeft,top:surface.scrollTop};});surface.addEventListener('scroll',()=>{if(game)state.mapScroll={left:surface.scrollLeft,top:surface.scrollTop};},{passive:true});
    surface.addEventListener('pointermove',e=>{
      const c=e.target.closest?.('[data-country]');if(!c){tip.classList.remove('is-visible');return;}
      const q=game?state.run[state.index]:null;
      const hide=!!(q?.kind==='locate' && !state.answered);
      tip.textContent=hide?'UNLABELED COUNTRY':c.dataset.country;
      const r=surface.getBoundingClientRect();tip.style.left=`${Math.max(8,Math.min(e.clientX-r.left,r.width-175))+surface.scrollLeft}px`;tip.style.top=`${Math.max(40,e.clientY-r.top)+surface.scrollTop}px`;
      tip.classList.add('is-visible');
    });
    surface.addEventListener('pointerleave',()=>tip.classList.remove('is-visible'));
    surface.addEventListener('click',e=>{
      const c=e.target.closest?.('[data-country]');if(!c)return;
      if(game && state.run[state.index]?.kind==='locate' && !state.answered){answerQuestion(c.dataset.country);}
      else if(!game){toast(`${c.dataset.country} — located!`);}
      else if(state.run[state.index].kind!=='locate' && !state.answered){toast(`${c.dataset.country} — found on your atlas.`);}
    });
    if(game && state.hinted && !state.answered && state.run[state.index].kind==='locate')markMapHint();
  }
  function markMapHint(){const q=state.run[state.index];document.querySelectorAll('.country').forEach(c=>{c.classList.toggle('map-hint',c.dataset.country===q.target);});}
  function markMapAnswers(){const q=state.run[state.index];document.querySelectorAll('.country').forEach(c=>{c.classList.toggle('map-selected',c.dataset.country===q.target);c.classList.toggle('map-error',!!(state.answer && state.answer!==q.target && c.dataset.country===state.answer));c.classList.remove('map-hint');});}
  function useHint(){if(state.answered||state.hinted||state.hints<=0)return;state.hints--;state.hinted=true;const q=state.run[state.index];if(q.kind==='choice'){state.disabledOptions=shuffle(q.options.filter(a=>a!==q.answer)).slice(0,q.options.length===2?1:2);}renderGame();toast(q.kind==='locate'?'Signal flare: the target country is outlined.':'Signal flare: some wrong answers vanished.');}
  function answerQuestion(value,timedOut=false){
    if(state.answered||state.screen!=='play')return;
    clearTimer();
    const q=state.run[state.index],correct=!timedOut && value===q.answer;
    state.answered=true;state.answer=value;state.correct+=correct?1:0;
    state.streak=correct?state.streak+1:0;state.bestStreak=Math.max(state.bestStreak,state.streak);
    const base=state.hinted?65:100;
    const combo=correct?Math.min(state.streak,5)*10:0;
    const speed=correct && state.mode==='sprint'?Math.min(50,Math.max(0,state.timeLeft*2)):0;
    state.earned=correct?(base+combo+speed):0;
    state.score+=state.earned;
    state.review.push({q:q.q,kind:q.kind,correct,answer:q.answer,given:value,explain:q.fact,timedOut});
    tone(correct);
    state.feedbackQuip=rand(correct?CORRECT_LINES:WRONG_LINES);
    renderGame();
    if(correct && (state.streak===5 || state.streak===10))confetti(18);
    const feed=document.getElementById('feedbackMount');
    if(feed)feed.scrollIntoView({behavior:'smooth',block:'nearest'});
  }
  function feedbackHTML(q){
    const v=state.review[state.review.length-1],correct=v.correct;
    const title=correct?'Beautifully charted.':v.timedOut?'Time ran out.':'Not quite. Keep exploring.';
    const scoreTxt=correct?`+${state.earned} POINTS ${state.hinted?'· hint used':''}${state.streak>1?` · ${state.streak} IN A ROW`:''}`:'NO POINTS THIS ROUND — BUT YOU LEARN THE FACT';
    const answer=correct?'':`<strong>Correct answer: ${esc(q.answer)}</strong> &nbsp;`;
    return `<div class="feedback ${correct?'':'bad'}" role="status" aria-live="polite"><div class="feedback-title">${title}</div><div class="feedback-score">${scoreTxt}</div><div class="feedback-text">${answer}${esc(q.fact)}</div><div class="feedback-quip">${esc(state.feedbackQuip)}</div><button id="nextButton" class="next-button">${state.index===19?'See Expedition Results':(state.index%5===4?'Next Chapter':'Continue Voyage')} <span class="button-arrow">→</span></button></div>`;
  }
  function nextQuestion(){if(!state.answered)return;state.index++;if(state.index>=state.run.length){finishGame();return;}beginQuestion();window.scrollTo({top:0,behavior:'smooth'});}
  function highKey(){return `${state.mode}:${state.name.toLowerCase()||'anonymous'}`;}
  function finishGame(){clearTimer();state.screen='results';let prev=highs[highKey()]||0;state.newBest=state.score>prev;if(state.newBest){highs[highKey()]=state.score;try{localStorage.setItem(storageKey,JSON.stringify(highs));}catch(_){}}
    renderResults();window.scrollTo({top:0,behavior:'smooth'});if(state.correct>=16)confetti(55);
  }
  function confetti(count){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const colors=['#e6b86e','#8ccfc1','#ecddd0','#d58e70'];for(let i=0;i<count;i++){let d=document.createElement('div');d.className='confetti';d.style.setProperty('--left',(Math.random()*100)+'vw');d.style.setProperty('--duration',(2+Math.random()*1.9)+'s');d.style.setProperty('--drift',(-12+Math.random()*24)+'vw');d.style.setProperty('--rotation',(Math.random()*300)+'deg');d.style.setProperty('--color',rand(colors));document.body.append(d);setTimeout(()=>d.remove(),4100);}}
  function resultsRank(){const c=state.correct;if(c>=19)return ['Grandmaster of the Atlas','The ink is barely dry and you already know the continent.'];if(c>=16)return ['Master Cartographer','Even a medieval mapmaker would hire you.'];if(c>=12)return ['Seasoned Navigator','Your route was excellent, with only a few detours.'];if(c>=8)return ['Skilled Explorer','A few wrong turns; plenty of territory conquered.'];return ['Apprentice Cartographer','Every great explorer once confused a peninsula with an island.'];}
  function renderResults(){const [rank,desc]=resultsRank();const missed=state.review.filter(r=>!r.correct);let score=state.score.toLocaleString();
    app.innerHTML=`<section class="results"><div class="results-head"><div class="seal">✧</div><div class="eyebrow" style="justify-content:center">EXPEDITION COMPLETE</div><h1 class="result-title">${esc(rank)}</h1><p class="result-sub">${esc(state.name || 'Explorer')}, ${desc}</p><div class="result-score">${score}</div><div class="result-label">TOTAL EXPEDITION POINTS</div>${state.newBest?'<div style="margin-top:15px" class="new-best">NEW PERSONAL BEST</div>':`<p style="font-size:12px;color:#9ab4b4">Personal best on this browser: ${(highs[highKey()]||0).toLocaleString()}</p>`}</div><div class="result-stats"><div class="result-stat"><strong>${state.correct}/20</strong><small>Correct answers</small></div><div class="result-stat"><strong>${Math.round(state.correct/20*100)}%</strong><small>Accuracy</small></div><div class="result-stat"><strong>${state.bestStreak}</strong><small>Longest streak</small></div></div><div class="result-actions"><button class="big-button" id="playAgain">Sail Again <span class="button-arrow">↗</span></button><button class="outline-button" id="copyResult">Copy Score Report</button><button class="outline-button" id="homeButton">Home / Change Mode</button></div><section class="review"><h3>${missed.length?`Explorer’s Field Notes · ${missed.length} to Review`:'A Perfectly Charted Route'}</h3>${missed.length?missed.map((r,i)=>`<div class="review-row"><div class="review-tag">NOTE ${String(i+1).padStart(2,'0')}</div><div class="review-main"><strong>${esc(r.q)}</strong><p><b>Answer:</b> ${esc(r.answer)}. ${esc(r.explain)}</p></div></div>`).join(''):'<p style="color:#bdccc9;font-size:13px">No questions to review. You correctly mapped all 20 challenges.</p>'}</section></section>`;
    document.getElementById('playAgain').addEventListener('click',()=>{state.run=pickRun();state.index=0;state.score=0;state.correct=0;state.streak=0;state.bestStreak=0;state.review=[];state.hints=3;state.screen='play';state.newBest=false;beginQuestion();window.scrollTo({top:0,behavior:'smooth'});});
    document.getElementById('homeButton').addEventListener('click',()=>{renderHome();window.scrollTo({top:0,behavior:'smooth'});});
    document.getElementById('copyResult').addEventListener('click',copyScore);
  }
  async function copyScore(){const missed=state.review.filter(r=>!r.correct);const msg=`EUROPA — The Cartographer's Quest\nExplorer: ${state.name||'Explorer'}\nMode: ${state.mode==='sprint'?'Speed Voyage':'Explorer'}\nScore: ${state.score}\nCorrect: ${state.correct}/20\nBest streak: ${state.bestStreak}\n${missed.length?`To review: ${missed.map(r=>r.answer).join(', ')}`:'Perfect score!'}`;
    let ok=false;try{await navigator.clipboard.writeText(msg);ok=true;}catch(_){try{const a=document.createElement('textarea');a.value=msg;a.style.position='fixed';a.style.top='-9999px';document.body.append(a);a.select();ok=document.execCommand('copy');a.remove();}catch(_){}}
    toast(ok?'Score report copied to clipboard.':'Copy unavailable in this browser. Your score is shown above.');
  }
  document.getElementById('soundToggle').addEventListener('click',()=>{soundOn=!soundOn;document.getElementById('soundText').textContent=soundOn?'Sound on':'Sound off';document.getElementById('soundIcon').textContent=soundOn?'◉':'◌';document.getElementById('soundToggle').setAttribute('aria-label',soundOn?'Disable sound':'Enable sound');if(soundOn)tone(true);});
  document.addEventListener('keydown',e=>{if(state.screen!=='play'||e.altKey||e.ctrlKey||e.metaKey)return;const active=document.activeElement?.tagName||'';if(['INPUT','TEXTAREA','SELECT'].includes(active))return;if(state.answered){if(e.key==='Enter'||e.key===' '){e.preventDefault();nextQuestion();}return;}const q=state.run[state.index];if(q?.kind==='choice'&&/^[1-4]$/.test(e.key)){const idx=Number(e.key)-1,opt=q.options[idx];if(opt && !state.disabledOptions.includes(opt)){e.preventDefault();answerQuestion(opt);}}});
  renderHome();
})();

</script>
</body></html>
